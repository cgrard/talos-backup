---
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-backup-secrets
spec:
  roles:
    - os:etcd:backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: talos-backup
spec:
  schedule: '0/10 * * * *'
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: talos-backup
              image: ghcr.io/siderolabs/talos-backup:latest
              workingDir: /tmp
              imagePullPolicy: IfNotPresent
              env:
                # S3 credentials, from a secret created with:
                # kubectl create secret generic talos-backup-s3 --from-literal=AWS_ACCESS_KEY_ID=... --from-literal=AWS_SECRET_ACCESS_KEY=...
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: talos-backup-s3
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: talos-backup-s3
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  value: us-west-2
                # CUSTOM_S3_ENDPOINT is optional; if omitted the service will fallback to default AWS endpoints.
                - name: CUSTOM_S3_ENDPOINT
                  value: https://my-s3-compatible-api.example.com:1234
                # USE_PATH_STYLE is optional and only used with CUSTOM_S3_ENDPOINT; path-style is the default,
                # set to false for S3-compatible endpoints that require virtual-hosted-style addressing.
                - name: USE_PATH_STYLE
                  value: 'true'
                - name: BUCKET
                  value: talos-backups
                # CLUSTER_NAME is optional; if omitted it will fall back to the name of the default context.
                - name: CLUSTER_NAME
                  value: 'prod-cluster'
                # S3_PREFIX is optional; if omitted it will fall back to the cluster name.
                - name: S3_PREFIX
                  value: 'important/backups'
                # AGE_RECIPIENT_PUBLIC_KEY supports multiple recipients as comma-separated keys,
                # post-quantum and classic keys cannot be mixed.
                # Set DISABLE_ENCRYPTION to 'true' instead to upload unencrypted snapshots.
                - name: AGE_RECIPIENT_PUBLIC_KEY
                  value: 'age1khpnnl86pzx96ttyjmldptsl5yn2v9jgmmzcjcufvk00ttkph9zs0ytgec,age1majtfe4q0u030xcjg0ent45stsfev28fjwy0saxqw4c3x85gge5s5gtkwx'
                # ENABLE_COMPRESSION is optional; set this to true if you want to add compression to your etcd snapshot
                # If enabled, snapshot will be compressed with zstd algorithm
                - name: ENABLE_COMPRESSION
                  value: 'false'
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /talos-backup
              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /.talos
                  name: talos
                - mountPath: /var/run/secrets/talos.dev
                  name: talos-secrets
          restartPolicy: OnFailure
          volumes:
            - emptyDir: {}
              name: tmp
            - emptyDir: {}
              name: talos
            - name: talos-secrets
              secret:
                secretName: talos-backup-secrets
